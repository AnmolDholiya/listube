spring.application.name=listing-platform
server.port=${PORT:8080}

# Supabase / PostgreSQL Database configuration
# All credentials injected dynamically via environment variables
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool settings optimized for Supabase / Cloud Postgres
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.leak-detection-threshold=30000

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Flyway configuration
# Set SPRING_FLYWAY_ENABLED=false since tables are pre-created in Supabase
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Supabase Project API Configuration (for Supabase REST / Auth / Storage if configured)
supabase.url=${SUPABASE_URL:}
supabase.key=${SUPABASE_KEY:}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}

# Swagger UI / OpenAPI configuration
springdoc.swagger-ui.path=/swagger-ui.html

# JWT configuration
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Multipart File Upload limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# Product Image Upload directory
app.upload.dir=uploads

# Flipkart Self-Access Sandbox Configuration
flipkart.mode=${FLIPKART_MODE:SANDBOX}
flipkart.environment=${FLIPKART_ENVIRONMENT:sandbox}
flipkart.client-id=${FLIPKART_CLIENT_ID:}
flipkart.client-secret=${FLIPKART_CLIENT_SECRET:}
flipkart.seller-id=${FLIPKART_SELLER_ID:}
flipkart.base-url=${FLIPKART_BASE_URL:https://sandbox-api.flipkart.net}
flipkart.token-url=${FLIPKART_TOKEN_URL:https://sandbox-api.flipkart.net/oauth-service/oauth/token}
flipkart.scope=${FLIPKART_SCOPE:Seller_Api}
flipkart.service.url=${FLIPKART_SERVICE_URL:http://localhost:8081}
flipkart.webhook.secret=${FLIPKART_WEBHOOK_SECRET:flipkart-secret-webhook-key-2026}

# Amazon Service URL
amazon.service.url=${AMAZON_SERVICE_URL:http://localhost:8082}
