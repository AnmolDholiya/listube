spring.application.name=listing-platform

# Supabase / PostgreSQL Database configuration
# Supports standard SPRING_DATASOURCE_* or SUPABASE_DB_* environment variables
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db.ryfddbpbmcfocdsysinh.supabase.co:5432/postgres?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Anmol@56346881}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool settings optimized for Supabase / Cloud Postgres
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.leak-detection-threshold=30000

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Flyway configuration
# Set SPRING_FLYWAY_ENABLED=false since tables are pre-created in Supabase
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

